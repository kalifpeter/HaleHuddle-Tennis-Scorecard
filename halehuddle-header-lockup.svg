<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="hhHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#135BE8"/>
      <stop offset="50%" stop-color="#0797D2"/>
      <stop offset="100%" stop-color="#662BD9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#041D3E" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#hhHeader)"/>
  <g filter="url(#shadow)" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
     font-size="110" font-weight="900">
    <text x="70" y="175" font-style="italic" transform="skewX(-7)">HALE</text>
    <text x="332" y="175">HUDDLE</text>
  </g>
  <text x="72" y="250" fill="#EAF9FF"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="42" font-weight="800" letter-spacing="2">PLAN IT • TRACK IT • REMEMBER IT • RE-LIVE IT</text>
</svg>
