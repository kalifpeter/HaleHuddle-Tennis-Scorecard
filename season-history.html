<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#135BE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HaleHuddle Tennis">
<title>HaleHuddle Tennis — Season History</title>
<link rel="stylesheet" href="halehuddle-tennis.css?v=2.5">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:18px 12px 44px}
.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}
select,button{font:inherit}
select{min-height:46px;border:1px solid rgba(10,41,72,.18);border-radius:11px;padding:10px 11px;background:#fff;color:var(--hh-ink);font-size:16px}
.history-card{background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(235,243,249,.95));border:1px solid rgba(10,41,72,.12);border-radius:17px;padding:14px;margin-bottom:12px;box-shadow:0 8px 22px rgba(10,36,66,.10)}
.meta{font-size:12px;font-weight:900;color:var(--hh-muted);margin-bottom:5px}
.matchup{font-size:19px;font-weight:950;color:var(--hh-title);margin-bottom:5px}
.format{font-size:13px;color:var(--hh-muted);font-weight:800}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
button{min-height:44px;border:0;border-radius:11px;font-weight:900;padding:8px}
.primary{background:linear-gradient(180deg,var(--hh-primary-top),var(--hh-primary-bottom));color:#fff;box-shadow:0 4px 0 var(--hh-primary-shadow)}
.secondary{background:linear-gradient(145deg,var(--hh-card-1),var(--hh-card-2),var(--hh-card-3));color:var(--hh-title)}
.danger{background:linear-gradient(135deg,var(--hh-danger-pink),var(--hh-danger-magenta),var(--hh-danger-purple));color:#fff}
.recap{display:none;margin-top:12px;white-space:pre-wrap;background:rgba(255,255,255,.8);border:1px solid rgba(10,41,72,.12);border-radius:12px;padding:10px;font-size:13px;line-height:1.45}
.empty{background:rgba(255,255,255,.85);border-radius:17px;padding:24px;text-align:center;color:var(--hh-muted);font-weight:800}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.summary-box{background:linear-gradient(145deg,var(--hh-card-1),var(--hh-card-2),var(--hh-card-3));border-radius:14px;padding:12px;text-align:center}
.summary-label{font-size:12px;font-weight:900;color:var(--hh-muted)}
.summary-num{font-size:28px;font-weight:950;color:var(--hh-title)}
@media(max-width:460px){.actions{grid-template-columns:1fr}.controls{grid-template-columns:1fr}}
</style>
<style id="hh-critical-header">
/* Source-level responsive header; self-contained even if external CSS is stale. */
.hh-app-header{background:#fff;border-bottom:1px solid #e6ebf2;position:relative!important;z-index:1;width:100%;overflow:hidden}
.hh-app-header-inner{box-sizing:border-box;position:relative;max-width:820px;margin:0 auto;padding:10px 16px;min-height:0!important;display:flex!important;align-items:center!important;justify-content:center!important}
.hh-logo-wrap{display:flex!important;align-items:center!important;justify-content:center!important;max-width:100%}
.hh-app-header img.hh-approved-teams-logo{display:block!important;box-sizing:border-box!important;width:78px!important;height:92px!important;min-width:0!important;max-width:78px!important;max-height:92px!important;object-fit:contain!important;margin:0 auto!important;flex:0 0 auto!important}
.hh-app-header .hh-product{display:none!important}
.hh-app-header .hh-tennis-chip{position:absolute;right:16px;top:50%;transform:translateY(-50%);padding:6px 9px;border-radius:999px;background:#edf4ff;border:1px solid #dce8ff;color:#135be8;font-size:10px;font-weight:900;letter-spacing:.6px}
body.hh-home .hh-app-header-inner{padding:18px 16px 12px}
body.hh-home .hh-app-header img.hh-approved-teams-logo{width:145px!important;height:171px!important;max-width:145px!important;max-height:171px!important}
body.hh-home .hh-app-header .hh-tennis-chip{display:none!important}
</style><style id="hh-dark-inline">html[data-hh-theme="dark"] .hh-app-header{background:#000!important;border-color:#293548!important}html[data-hh-theme="dark"] .hh-tennis-chip{background:#203958!important;color:#b8d4ff!important;border-color:#45618a!important}</style><script>try{document.documentElement.dataset.hhTheme=(localStorage.getItem('hh-teams-theme-v1')||'system')==='dark'?'dark':((localStorage.getItem('hh-teams-theme-v1')||'system')==='system'&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.hhTheme='light'}</script><script defer src="hh-theme.js?v=2.5"></script></head>
<body>
<header class="hh-app-header">
  <div class="hh-app-header-inner">
    <div class="hh-logo-wrap">
      <img class="hh-approved-teams-logo" src="hh-teams-approved-logo.png" width="78" height="92" style="display:block!important;box-sizing:border-box!important;width:78px!important;height:92px!important;min-width:0!important;max-width:78px!important;max-height:92px!important;object-fit:contain!important;margin:0 auto!important;" alt="HaleHuddle Teams">
      <div class="hh-product">TENNIS</div>
    </div>
    <div class="hh-tennis-chip">SEASON</div>
  </div>
</header>
<div class="hh-format-nav"><a href="index.html?v=season1">← Tennis Scorecards</a></div>
<main>
  <h1>Season Match History</h1>
  <p class="sub">Saved matches stay on this device. Choose a season to review previous scorecards and resend a coach recap.</p>

  <div class="controls">
    <select id="seasonFilter" aria-label="Season filter"></select>
    <button id="clearSeasonBtn" class="danger" type="button">Clear Season</button>
  </div>

  <div class="summary">
    <div class="summary-box"><div class="summary-label">Saved Matches</div><div id="matchCount" class="summary-num">0</div></div>
    <div class="summary-box"><div class="summary-label">Formats Used</div><div id="formatCount" class="summary-num">0</div></div>
  </div>

  <div id="history"></div>
</main>

<script>
(function(){
  const key='halehuddle-tennis-season-history-v1';
  const $=id=>document.getElementById(id);

  function load(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}
  function save(items){try{localStorage.setItem(key,JSON.stringify(items))}catch(e){}}
  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function prettyDate(v){
    if(!v)return 'No date';
    const p=v.split('-');
    return p.length===3 ? Number(p[1])+'/'+Number(p[2])+'/'+p[0] : v;
  }

  function seasons(items){
    return [...new Set(items.map(x=>x.season||'Current Season'))].sort((a,b)=>a.localeCompare(b));
  }

  function renderFilters(items){
    const current=$('seasonFilter').value;
    const list=seasons(items);
    $('seasonFilter').innerHTML='';
    if(!list.length){
      const o=document.createElement('option');o.value='';o.textContent='No saved seasons';$('seasonFilter').appendChild(o);return;
    }
    list.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;$('seasonFilter').appendChild(o)});
    if(list.includes(current))$('seasonFilter').value=current;
    else{
      try{
        const last=localStorage.getItem('halehuddle-tennis-last-season');
        if(last&&list.includes(last))$('seasonFilter').value=last;
      }catch(e){}
    }
  }

  function shareText(text){
    if(navigator.share){
      navigator.share({title:'HaleHuddle Tennis Match',text}).catch(e=>{});
    }else{
      const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
      location.href=(isiOS?'sms:&body=':'sms:?body=')+encodeURIComponent(text);
    }
  }

  function render(){
    const items=load();
    renderFilters(items);
    const season=$('seasonFilter').value;
    const filtered=items.filter(x=>(x.season||'Current Season')===season);
    $('matchCount').textContent=filtered.length;
    $('formatCount').textContent=new Set(filtered.map(x=>x.format)).size;

    const host=$('history');
    host.innerHTML='';
    if(!filtered.length){
      host.innerHTML='<div class="empty">No matches saved for this season yet.</div>';
      return;
    }

    filtered.forEach(item=>{
      const card=document.createElement('section');
      card.className='history-card';
      card.innerHTML=`
        <div class="meta">${esc(prettyDate(item.date))} • ${esc(item.season||'Current Season')}</div>
        <div class="matchup">${esc(item.teamA)} vs ${esc(item.teamB)}</div>
        <div class="format">${esc(item.format)}</div>
        <div class="actions">
          <button class="secondary view" type="button">View Recap</button>
          <button class="primary share" type="button">Text / Share</button>
          <button class="danger delete" type="button">Delete</button>
        </div>
        <div class="recap">${esc(item.recap||'')}</div>
      `;
      host.appendChild(card);

      const recap=card.querySelector('.recap');
      card.querySelector('.view').addEventListener('click',()=>{
        const show=recap.style.display!=='block';
        recap.style.display=show?'block':'none';
        card.querySelector('.view').textContent=show?'Hide Recap':'View Recap';
      });
      card.querySelector('.share').addEventListener('click',()=>shareText(item.recap||''));
      card.querySelector('.delete').addEventListener('click',()=>{
        if(!confirm('Delete this saved match?'))return;
        const next=load().filter(x=>x.id!==item.id);
        save(next);render();
      });
    });
  }

  $('seasonFilter').addEventListener('change',render);
  $('clearSeasonBtn').addEventListener('click',()=>{
    const season=$('seasonFilter').value;
    if(!season)return;
    if(!confirm('Delete every saved match in '+season+'?'))return;
    save(load().filter(x=>(x.season||'Current Season')!==season));
    render();
  });

  render();
})();
</script>
</body>
</html>
