<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#135BE8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HH Teams"><title>Season Roster | HaleHuddle Teams</title><link rel="stylesheet" href="halehuddle-tennis.css?v=2.5"><link rel="apple-touch-icon" href="app-icon-180.png"><style>main{max-width:820px;margin:auto;padding:22px 14px 44px}h1{font-size:28px;margin:0 0 5px}.sub{color:var(--hh-muted);margin:0 0 18px;line-height:1.45}.card{border-radius:18px;padding:16px;margin-bottom:14px}.athlete{display:grid;grid-template-columns:1fr 100px 44px;gap:8px;align-items:end;margin:10px 0}.athlete button{height:44px;border:0;border-radius:11px;background:#fff0f0;color:#b42318;font-weight:900;font-size:18px}.empty{padding:18px;text-align:center;color:#667085;background:#f8fafc;border-radius:12px}.topActions{display:flex;gap:9px;margin:14px 0}.topActions .btn{flex:1}.saved{display:none;margin-top:10px;color:#176d38;font-weight:800}.back{display:inline-block;margin-bottom:14px;text-decoration:none;color:#135BE8;font-weight:800}@media(max-width:480px){.athlete{grid-template-columns:1fr 80px 44px}}</style><style id="hh-critical-header">
/* Source-level responsive header; self-contained even if external CSS is stale. */
.hh-app-header{background:#fff;border-bottom:1px solid #e6ebf2;position:relative!important;z-index:1;width:100%;overflow:hidden}
.hh-app-header-inner{box-sizing:border-box;position:relative;max-width:820px;margin:0 auto;padding:10px 16px;min-height:0!important;display:flex!important;align-items:center!important;justify-content:center!important}
.hh-logo-wrap{display:flex!important;align-items:center!important;justify-content:center!important;max-width:100%}
.hh-app-header img.hh-approved-teams-logo{display:block!important;box-sizing:border-box!important;width:78px!important;height:92px!important;min-width:0!important;max-width:78px!important;max-height:92px!important;object-fit:contain!important;margin:0 auto!important;flex:0 0 auto!important}
.hh-app-header .hh-product{display:none!important}
.hh-app-header .hh-tennis-chip{position:absolute;right:16px;top:50%;transform:translateY(-50%);padding:6px 9px;border-radius:999px;background:#edf4ff;border:1px solid #dce8ff;color:#135be8;font-size:10px;font-weight:900;letter-spacing:.6px}
body.hh-home .hh-app-header-inner{padding:18px 16px 12px}
body.hh-home .hh-app-header img.hh-approved-teams-logo{width:145px!important;height:171px!important;max-width:145px!important;max-height:171px!important}
body.hh-home .hh-app-header .hh-tennis-chip{display:none!important}
</style><style id="hh-dark-inline">html[data-hh-theme="dark"] .hh-app-header{background:#000!important;border-color:#293548!important}html[data-hh-theme="dark"] .hh-tennis-chip{background:#203958!important;color:#b8d4ff!important;border-color:#45618a!important}</style><script>try{document.documentElement.dataset.hhTheme=(localStorage.getItem('hh-teams-theme-v1')||'system')==='dark'?'dark':((localStorage.getItem('hh-teams-theme-v1')||'system')==='system'&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.hhTheme='light'}</script><script defer src="hh-theme.js?v=2.5"></script></head><body><header class="hh-app-header"><div class="hh-app-header-inner"><div class="hh-logo-wrap"><img class="hh-approved-teams-logo" src="hh-teams-approved-logo.png" width="78" height="92" style="display:block!important;box-sizing:border-box!important;width:78px!important;height:92px!important;min-width:0!important;max-width:78px!important;max-height:92px!important;object-fit:contain!important;margin:0 auto!important;" alt="HaleHuddle Teams"><div class="hh-product">TENNIS</div></div><div class="hh-tennis-chip">ROSTER</div></div></header><main><a class="back" href="index.html">‹ Home</a><h1>Season Roster</h1><p class="sub" id="meta">Add athletes once, then use them when building match lineups.</p><div class="card"><div id="list"></div><div class="topActions"><button class="btn secondary" id="add">+ Add Athlete</button><button class="btn primary" id="save">Save Roster</button></div><div class="saved" id="saved">Roster saved on this device.</div><p class="note">Cloud team syncing comes later. This version proves the roster and lineup workflow locally without changing your working scorecards or timer notifications.</p></div></main><script>
const TEAM='halehuddle-teams-tennis-team-v1',KEY='halehuddle-teams-tennis-roster-v1';let roster=[];const $=id=>document.getElementById(id);
function id(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let el=$('list');if(!roster.length){el.innerHTML='<div class="empty">No athletes yet. Tap <b>+ Add Athlete</b>.</div>';return}el.innerHTML=roster.map((a,i)=>`<div class="athlete"><div class="field"><label>Athlete name</label><input data-i="${i}" data-k="name" value="${esc(a.name)}" placeholder="First and last name"></div><div class="field"><label>ID # <span class="note">optional</span></label><input data-i="${i}" data-k="number" value="${esc(a.number)}" placeholder="#"></div><button data-del="${i}" aria-label="Remove athlete">×</button></div>`).join('');el.querySelectorAll('input').forEach(x=>x.oninput=()=>roster[+x.dataset.i][x.dataset.k]=x.value);el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{roster.splice(+b.dataset.del,1);render()})}
$('add').onclick=()=>{roster.push({id:id(),name:'',number:''});render();setTimeout(()=>{let x=document.querySelectorAll('[data-k=name]');x[x.length-1]?.focus()},0)};$('save').onclick=()=>{roster=roster.filter(a=>a.name.trim());localStorage.setItem(KEY,JSON.stringify(roster));render();$('saved').style.display='block';setTimeout(()=>$('saved').style.display='none',1800)};
try{roster=JSON.parse(localStorage.getItem(KEY)||'[]');let t=JSON.parse(localStorage.getItem(TEAM)||'null');if(t?.teamName)$('meta').textContent=[t.teamName,t.season,'Add athletes once, then use them when building match lineups.'].filter(Boolean).join(' • ');if(t?.primary)document.documentElement.style.setProperty('--team-primary',t.primary)}catch(e){}render();
</script></body></html>
