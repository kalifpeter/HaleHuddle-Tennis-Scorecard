</style></head><body><header class="hh-app-header"><div class="hh-app-header-inner"><div class="hh-logo-wrap"><img class="hh-approved-teams-logo" src="hh-teams-approved-logo.png" width="78" height="92" style="display:block!important;box-sizing:border-box!important;width:78px!important;height:92px!important;min-width:0!important;max-width:78px!important;max-height:92px!important;object-fit:contain!important;margin:0 auto!important;" alt="HaleHuddle Teams"><div class="hh-product">TENNIS</div></div><div class="hh-tennis-chip">ROSTER</div></div></header><main><nav aria-label="Page navigation"><a class="hh-page-home" href="index.html">‹ Home</a></nav><h1>Season Roster</h1><p class="sub" id="meta">Add athletes once, then use them when building match lineups.</p><div class="card"><div id="list"></div><div class="topActions"><button class="btn secondary" id="add">+ Add Athlete</button><button class="btn primary" id="save">Save Roster</button></div><div class="saved" id="saved">Roster saved on this device.</div><p class="note">Cloud team syncing comes later. This version proves the roster and lineup workflow locally without changing your working scorecards or timer notifications.</p></div></main><script>
const TEAM='halehuddle-teams-tennis-team-v1',KEY='halehuddle-teams-tennis-roster-v1';let roster=[];const $=id=>document.getElementById(id);
function id(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let el=$('list');if(!roster.length){el.innerHTML='<div class="empty">No athletes yet. Tap <b>+ Add Athlete</b>.</div>';return}el.innerHTML=roster.map((a,i)=>`<div class="athlete"><div class="field"><label>Athlete name</label><input data-i="${i}" data-k="name" value="${esc(a.name)}" placeholder="First and last name"></div><div class="field"><label>ID # <span class="note">optional</span></label><input data-i="${i}" data-k="number" value="${esc(a.number)}" placeholder="#"></div><button data-del="${i}" aria-label="Remove athlete">×</button></div>`).join('');el.querySelectorAll('input').forEach(x=>x.oninput=()=>roster[+x.dataset.i][x.dataset.k]=x.value);el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{roster.splice(+b.dataset.del,1);render()})}
$('add').onclick=()=>{roster.push({id:id(),name:'',number:''});render();setTimeout(()=>{let x=document.querySelectorAll('[data-k=name]');x[x.length-1]?.focus()},0)};$('save').onclick=()=>{roster=roster.filter(a=>a.name.trim());localStorage.setItem(KEY,JSON.stringify(roster));render();$('saved').style.display='block';setTimeout(()=>$('saved').style.display='none',1800)};
try{roster=JSON.parse(localStorage.getItem(KEY)||'[]');let t=JSON.parse(localStorage.getItem(TEAM)||'null');if(t?.teamName)$('meta').textContent=[t.teamName,t.season,'Add athletes once, then use them when building match lineups.'].filter(Boolean).join(' • ');if(t?.primary)document.documentElement.style.setProperty('--team-primary',t.primary)}catch(e){}render();
</script><script defer src="hh-unsaved-navigation.js?v=2.6"></script></body></html>
