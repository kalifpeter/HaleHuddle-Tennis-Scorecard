<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f5">
<title>JTT Junior Timed Match</title><style>
:root{--bg:#f4f7f5;--card:#fff;--text:#17211b;--muted:#69766e;--line:#d7ded9;--green:#17643d;--pale:#e5f3e9;--yellow:#fff5d5;--yellowline:#e6c75d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 28px}
.back{display:inline-block;text-decoration:none;color:var(--green);background:var(--pale);padding:8px 13px;border-radius:999px;font-weight:850;font-size:14px;margin-bottom:17px}
h1{font-size:29px;line-height:1.08;margin:0 0 7px;font-weight:900}
h2{font-size:22px}
.sub{color:var(--muted);font-weight:650;font-size:15px;line-height:1.4;margin:0 0 18px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:17px 18px;margin:0 0 14px}
label,.label{display:block;color:var(--muted);font-weight:800;font-size:13px;margin:0 0 6px}
input,select{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:13px;background:#fff;color:var(--text);font-size:16px;padding:8px 12px}
.topgrid{display:grid;gap:11px}
.match-title{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:14px}
.match-title h2{font-size:21px;margin:0}
.winner{background:#eef2ef;border-radius:999px;padding:7px 10px;font-weight:850;text-align:center;font-size:13px}
.players,.score-row{display:grid;grid-template-columns:1fr 44px 1fr;gap:9px;align-items:end}
.vs{text-align:center;font-weight:900;color:var(--muted);font-size:17px;padding-bottom:13px}
.players.double .side{display:grid;gap:7px}
.divider{height:1px;background:var(--line);margin:14px 0}
.score-row input{text-align:center;font-weight:850}
.default-wrap{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.default-open{background:var(--yellow);border:1.5px solid var(--yellowline);color:#684e08;border-radius:13px;padding:11px 13px;font-size:15px;font-weight:900}
.default-panel{margin-top:10px;background:#fff9e9;border:1.5px solid var(--yellowline);border-radius:14px;padding:13px}
.default-panel[hidden]{display:none}
.default-panel h3{margin:0 0 10px;font-size:16px}
.choose,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choose button,.actions button{min-height:43px;border:0;border-radius:12px;font-size:14px;font-weight:850}
.choose button{background:#eef2ef;color:var(--text)}
.choose button.selected{background:var(--green);color:white}
.awards{display:grid;gap:8px;margin-top:10px}
.apply{background:#9eb6a3;color:white}.apply.ready{background:var(--green)}
.cancel{background:#eef2ef;color:var(--text)}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.totalbox{background:var(--pale);border-radius:15px;padding:12px;text-align:center;font-weight:850;font-size:13px}
.totalbox strong{display:block;font-size:27px;margin-top:4px}
.recap{white-space:pre-wrap;background:#f8faf9;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:14px;line-height:1.5;font-weight:600}
.primary,.secondary{border:0;border-radius:12px;font-size:14px;font-weight:850;padding:11px 14px}
.primary{background:var(--green);color:#fff}.secondary{background:#eef2ef;color:var(--text)}
.buttonrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:520px){
 main{padding:16px 14px 26px}
 h1{font-size:28px}
 .sub{font-size:15px}
 .card{padding:16px 16px;border-radius:19px;margin-bottom:13px}
 .players,.score-row{grid-template-columns:1fr 42px 1fr}
 .match-title h2{font-size:20px}
}
</style>
</head><body><main><a class="back" href="index.html">← Tennis Scorecards</a><h1>Junior Timed Match</h1><p class="sub">Orange / Green Ball timed scoring.</p>
<section class="card topgrid"><label>Date<input id="date" type="date"></label><label>Team 1<input id="teamA" placeholder="Team name"></label><label>Team 2<input id="teamB" placeholder="Team name"></label><label>Match length (minutes)<input id="mins" type="number" min="1" value="20"></label></section>
<div id="courts"></div><section class="card"><h2>Coach Recap</h2><div id="recap" class="recap"></div><div class="buttonrow"><button class="primary" id="share">Text / Share</button><button class="secondary" id="clear">New Match</button></div></section></main><script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const teamA=()=>$('#teamA').value.trim()||'Team 1', teamB=()=>$('#teamB').value.trim()||'Team 2';
function n(v){return v===''||v==null?null:Number(v)}
function names(card,side){return [$(side==='a'?'.pa1':'.pb1',card)?.value,$(side==='a'?'.pa2':'.pb2',card)?.value].filter(Boolean).join(' / ')||'—'}
function setupDefault(card,twoSets=false){
 const panel=$('.default-panel',card), a=$('.choose-a',card), b=$('.choose-b',card), apply=$('.apply',card);
 function refresh(){a.textContent=teamA();b.textContent=teamB();a.classList.toggle('selected',panel.dataset.win==='a');b.classList.toggle('selected',panel.dataset.win==='b');let ok=!!panel.dataset.win && $('.award1',card).value!=='';if(twoSets)ok=ok&&$('.award2',card).value!=='';apply.classList.toggle('ready',ok);apply.disabled=!ok}
 $('.default-open',card).onclick=()=>{panel.hidden=!panel.hidden;refresh()};
 a.onclick=()=>{panel.dataset.win='a';refresh()}; b.onclick=()=>{panel.dataset.win='b';refresh()};
 $$('.award1,.award2',card).forEach(x=>x.addEventListener('input',refresh));
 $('.cancel',card).onclick=()=>{panel.hidden=true};
 apply.onclick=()=>{const w=panel.dataset.win;if(!w)return;const g1=Math.max(0,Math.floor(Number($('.award1',card).value)));card.dataset.defaultWinner=w;card.dataset.defaulted='1';
   if(twoSets){const g2=Math.max(0,Math.floor(Number($('.award2',card).value)));$('.s1'+w,card).value=g1;$('.s1'+(w==='a'?'b':'a'),card).value=0;$('.s2'+w,card).value=g2;$('.s2'+(w==='a'?'b':'a'),card).value=0;$('.tb'+w,card).value='';$('.tb'+(w==='a'?'b':'a'),card).value='';}
   else{$('.s'+w,card).value=g1;$('.s'+(w==='a'?'b':'a'),card).value=0}
   panel.hidden=true; update();
 };
}

const KEY='jtt-clean-timed-v1';let data=[{name:'Singles 1'},{name:'Singles 2'},{name:'Doubles 1',dbl:true},{name:'Doubles 2',dbl:true}];
function render(){const host=$('#courts');host.innerHTML='';data.forEach((d,i)=>{let wrap=document.createElement('div');wrap.innerHTML=`<section class="card match" data-name="Timed Court"><div class="match-title"><h2>Timed Court</h2><div class="winner">Winner: —</div></div><div class="players"><input class="pa1" placeholder="Player name"><div class="vs">vs</div><input class="pb1" placeholder="Opponent name"></div><div class="score-row"><input class="sa" type="number" min="0" inputmode="numeric"><div class="vs">vs</div><input class="sb" type="number" min="0" inputmode="numeric"></div><div class="default-wrap"><button type="button" class="default-open">Default / Forfeit</button>
<div class="default-panel" hidden><h3>Who receives the win?</h3>
<div class="choose"><button type="button" class="choose-a">Team 1</button><button type="button" class="choose-b">Team 2</button></div>
<div class="awards"><label>Games awarded<input class="award1" type="number" min="0" inputmode="numeric" placeholder="0"></label></div><div class="actions"><button type="button" class="apply">Apply Default / Forfeit</button><button type="button" class="cancel">Cancel</button></div>
</div></div></section>`;let c=wrap.firstElementChild;c.dataset.name=d.name;if(d.dbl){$('.players',c).classList.add('double');$('.players',c).innerHTML='<div class="side"><input class="pa1" placeholder="Player 1"><input class="pa2" placeholder="Player 2"></div><div class="vs">vs</div><div class="side"><input class="pb1" placeholder="Player 1"><input class="pb2" placeholder="Player 2"></div>'}host.appendChild(c);setupDefault(c,false);$$('input',c).forEach(x=>x.addEventListener('input',update))});update()}
function update(){let lines=[];$$('.match').forEach(c=>{let a=n($('.sa',c).value),b=n($('.sb',c).value),w=a!==null&&b!==null&&a!==b?(a>b?teamA():teamB()):'—';$('.winner',c).textContent=(c.dataset.defaulted?'DEFAULT — ':'')+'Winner: '+w;lines.push(c.dataset.name+' — '+names(c,'a')+' vs '+names(c,'b')+' — '+(a??'—')+'–'+(b??'—')+(c.dataset.defaulted?' (Default/Forfeit)':''))});$('#recap').textContent=($('#date').value||'No date')+'\n'+teamA()+' vs '+teamB()+'\n\n'+lines.join('\n\n');save()}
function save(){let vals=$$('input').map(x=>x.value);localStorage.setItem(KEY,JSON.stringify(vals))}
function load(){try{let vals=JSON.parse(localStorage.getItem(KEY)||'[]');$$('input').forEach((x,i)=>{if(vals[i]!=null)x.value=vals[i]})}catch(e){}}
render();load();update();$$('#date,#teamA,#teamB,#mins').forEach(x=>x.addEventListener('input',update));$('#share').onclick=async()=>{const text=$('#recap').textContent;if(navigator.share){try{await navigator.share({text})}catch(e){}}else location.href='sms:&body='+encodeURIComponent(text)};$('#clear').onclick=()=>{localStorage.removeItem(KEY);location.reload()};
</script></body></html>
